[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-voice"
version = "0.1.0"
description = "Voice-agent platform access layer: unified synchronous SPI and normalized event model for hosted voice AI platforms"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "fusion-channel",
]

[project.optional-dependencies]
api = ["fastapi>=0.110"]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[project.urls]
Repository = "https://github.com/dahai80/fusion-voice"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]
