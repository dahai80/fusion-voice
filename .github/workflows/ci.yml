name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install in-tree dependency (fusion-channel is not on PyPI)
        run: pip install "fusion-channel @ git+https://github.com/dahai80/fusion-channel.git"

      - name: Install package with test extras
        run: pip install -e ".[test,api]" ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest tests/ -q

      - name: Performance budgets
        run: pytest tests/test_perf.py -q
        env:
          FUSION_VOICE_BENCH: "1"
